<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Nyarindo Library</title>
  <desc id="desc">A red, green, and blue stack of books beneath a golden attention point.</desc>
  <defs>
    <radialGradient id="field" cx="72%" cy="18%" r="90%">
      <stop offset="0" stop-color="#225565"/>
      <stop offset="0.52" stop-color="#0d2932"/>
      <stop offset="1" stop-color="#061218"/>
    </radialGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop stop-color="#b84447"/><stop offset="1" stop-color="#ef7b6f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop stop-color="#2f7951"/><stop offset="1" stop-color="#75c58b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop stop-color="#1f62b4"/><stop offset="1" stop-color="#73b8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#071319"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#field)"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#d9b16d" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#d9b16d" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="256" cy="152" r="17" fill="#f2d27f"/>
  <circle cx="256" cy="152" r="31" fill="none" stroke="#f2d27f" stroke-opacity=".24" stroke-width="4"/>
  <g stroke="#fff" stroke-opacity=".58" stroke-width="3">
    <rect x="116" y="220" width="280" height="58" rx="13" fill="url(#red)"/>
    <rect x="102" y="286" width="306" height="60" rx="13" fill="url(#green)"/>
    <rect x="128" y="354" width="262" height="62" rx="13" fill="url(#blue)"/>
  </g>
  <g fill="#fff" fill-opacity=".22">
    <rect x="124" y="229" width="8" height="40" rx="4"/>
    <rect x="110" y="295" width="8" height="42" rx="4"/>
    <rect x="136" y="363" width="8" height="44" rx="4"/>
  </g>
</svg>
