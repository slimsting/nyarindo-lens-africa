    <path d="M152 419 207 403 202 370 243 343 276 371" opacity=".72"/>
    <path d="M393 298 408 360 451 327 478 383 503 349" opacity=".72"/>
    <path d="M615 287 606 335 684 302 679 256" opacity=".72"/>
