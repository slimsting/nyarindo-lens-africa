      <circle cx="276" cy="371" r="9"/>
      <circle cx="331" cy="349" r="5"/>
      <circle cx="408" cy="360" r="7"/>
      <circle cx="478" cy="383" r="4.5"/>
      <circle cx="548" cy="369" r="8"/>
