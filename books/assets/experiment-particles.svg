<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Particles in conversation</title>
  <desc id="description">Luminous particles gather into loose clusters and connected currents.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="26%" r="88%">
      <stop offset="0" stop-color="#164655"/>
      <stop offset=".5" stop-color="#081f29"/>
      <stop offset="1" stop-color="#030b10"/>
    </radialGradient>
    <radialGradient id="warm" cx="38%" cy="36%" r="70%">
      <stop offset="0" stop-color="#fff4ba"/>
      <stop offset=".38" stop-color="#f0bd63"/>
      <stop offset="1" stop-color="#d16d43"/>
    </radialGradient>
    <radialGradient id="cool" cx="38%" cy="36%" r="70%">
      <stop offset="0" stop-color="#e2feff"/>
      <stop offset=".42" stop-color="#79d2df"/>
      <stop offset="1" stop-color="#307a91"/>
    </radialGradient>
    <linearGradient id="current" x1="95" y1="430" x2="858" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9b16d" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#8ce0e6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#d9b16d" stop-opacity=".12"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="1" fill="#d7eced" opacity=".12"/>
      <circle cx="28" cy="31" r=".8" fill="#f1d188" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grain)" opacity=".8"/>
  <ellipse cx="756" cy="112" rx="235" ry="170" fill="#68cbd7" opacity=".05"/>
  <ellipse cx="131" cy="452" rx="265" ry="155" fill="#d9b16d" opacity=".055"/>

  <g fill="none" stroke="url(#current)" stroke-width="1.25">
